<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/brand-system.css" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background-color: var(--st-bg-light);
        }
        #s2-stage {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        #s2-safe {
          position: absolute;
          left: 124px;
          top: 294px;
          width: 648px;
          display: flex;
          flex-direction: column;
          gap: 18px;
          z-index: 4;
          transform-origin: center bottom;
        }
        #s2-watermark {
          position: absolute;
          right: -130px;
          bottom: -140px;
          width: 580px;
          height: 590px;
          opacity: 0.075;
          pointer-events: none;
          z-index: 1;
        }
        .s2-title-compact {
          font-size: 62px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.035em;
        }
        .s2-diagram-wrap {
          width: 648px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .s2-pulse-dot {
          fill: var(--st-accent);
          stroke: var(--st-ink-stroke);
          stroke-width: 2.5;
        }
      </style>

      <div id="root" data-composition-id="scene-02-technical-light" data-width="1080" data-height="1920">
        <div id="s2-stage" class="st-stage st-theme-light">
          <svg id="s2-bg-orbits" class="st-orbit-bg" viewBox="0 0 1080 1920" data-layout-ignore="true" aria-hidden="true">
            <g id="s2-bg-arc-group">
              <circle class="st-orbit-arc st-orbit-arc--outer" cx="1080" cy="40" r="360" />
              <circle class="st-orbit-arc st-orbit-arc--inner" cx="1040" cy="0" r="250" />
              <circle class="st-orbit-arc st-orbit-arc--bottom" cx="80" cy="1960" r="360" />
              <circle cx="944" cy="148" r="10" fill="#CEEF62" stroke="#10204D" stroke-width="2" />
            </g>
          </svg>

          <img id="s2-watermark" src="assets/brand/thinker-mark-light-bg.svg" alt="" data-layout-ignore="true" />

          <div id="s2-safe">
            <div class="st-editorial-title" style="gap: 14px;">
              <div id="s2-eyebrow" class="st-eyebrow-row">
                <svg id="s2-asterisk" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#10204D" stroke-width="3" stroke-linecap="round" data-layout-ignore="true" aria-hidden="true">
                  <path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5L4.2 16.5" />
                </svg>
                <span>MÉTODO · ARQUITECTURA</span>
              </div>

              <h2 id="s2-title" class="s2-title-compact">
                <span class="st-headline-line">Del diálogo <span class="st-accent-pill-on-light">al código.</span></span>
              </h2>

              <div class="st-editorial-divider">
                <div id="s2-divider-pill" class="st-divider-pill" data-layout-ignore="true"></div>
                <div class="st-divider-hairline" data-layout-ignore="true"></div>
              </div>
            </div>

            <div class="s2-diagram-wrap">
              <!-- Nodo 1: Wilma Card -->
              <div id="s2-node-1" class="st-wilma-node">
                <svg class="st-wilma-outline-svg" viewBox="0 0 648 164" preserveAspectRatio="none" data-layout-ignore="true" aria-hidden="true">
                  <rect id="s2-wilma-stroke-1" x="2" y="2" width="644" height="160" rx="24" fill="none" stroke="#10204D" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
                </svg>
                <div class="st-wilma-node-inner">
                  <div class="st-node-header">
                    <span class="st-node-tag">NODO 01 · INDAGAR</span>
                    <span class="st-node-pill">DOMINIO</span>
                  </div>
                  <div class="st-node-title">Entender el problema real</div>
                  <div class="st-node-desc">Reglas explícitas antes de programar.</div>
                </div>
              </div>

              <!-- Conector 1 -> 2 -->
              <div id="s2-conn-1" class="st-connector-row">
                <svg width="36" height="34" viewBox="0 0 36 34" data-layout-ignore="true" aria-hidden="true">
                  <line id="s2-line-1" x1="18" y1="0" x2="18" y2="34" stroke="#10204D" stroke-width="3" pathLength="34" stroke-dasharray="34" stroke-dashoffset="34" />
                  <circle id="s2-dot-1" class="s2-pulse-dot" cx="18" cy="17" r="6" />
                </svg>
                <span class="st-connector-label">contrato modular</span>
              </div>

              <!-- Nodo 2: Wilma Card -->
              <div id="s2-node-2" class="st-wilma-node">
                <svg class="st-wilma-outline-svg" viewBox="0 0 648 164" preserveAspectRatio="none" data-layout-ignore="true" aria-hidden="true">
                  <rect id="s2-wilma-stroke-2" x="2" y="2" width="644" height="160" rx="24" fill="none" stroke="#10204D" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
                </svg>
                <div class="st-wilma-node-inner">
                  <div class="st-node-header">
                    <span class="st-node-tag">NODO 02 · SISTEMA</span>
                    <span class="st-node-pill">MODULAR</span>
                  </div>
                  <div class="st-node-title">Tokens y componentes</div>
                  <div class="st-node-desc">Piezas reutilizables y verificables.</div>
                </div>
              </div>

              <!-- Conector 2 -> Consola -->
              <div id="s2-conn-2" class="st-connector-row">
                <svg width="36" height="34" viewBox="0 0 36 34" data-layout-ignore="true" aria-hidden="true">
                  <line id="s2-line-2" x1="18" y1="0" x2="18" y2="34" stroke="#10204D" stroke-width="3" pathLength="34" stroke-dasharray="34" stroke-dashoffset="34" />
                  <circle id="s2-dot-2" class="s2-pulse-dot" cx="18" cy="17" r="6" />
                </svg>
                <span class="st-connector-label">render determinista</span>
              </div>

              <!-- Nodo 3: Consola Socrática -->
              <div id="s2-console" class="st-console-panel" style="width: 648px;">
                <div class="st-console-header">
                  <div class="st-console-dots" data-layout-ignore="true">
                    <span class="st-console-dot"></span>
                    <span class="st-console-dot"></span>
                    <span class="st-console-dot st-console-dot--accent"></span>
                  </div>
                  <span class="st-console-filename">system.spec.ts</span>
                </div>
                <div class="st-console-body">
                  <div id="s2-code-1" class="st-code-comment">// validación socrática</div>
                  <div id="s2-code-2" class="st-code-key">theme: "#FBFBF4 → #101A39"</div>
                  <div id="s2-code-3" class="st-code-accent">
                    → seek(t): OK (30 fps)
                    <span id="s2-cursor" class="st-code-cursor" data-layout-ignore="true"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="st-corner-block" data-layout-ignore="true"></div>
        </div>

        <div id="s2-curtain" class="st-pager-curtain st-pager-curtain--dark" data-layout-ignore="true"></div>
      </div>

      <script>
        (function buildScene02() {
          const eases = window.SocratechBrand?.EASES || {
            nobleReveal: "power4.out",
            pagerCover: "power3.inOut",
            structureSettle: "power2.out"
          };

          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s2-asterisk", { rotation: 0 }, { rotation: 150, duration: 5, ease: "none" }, 0);
          tl.fromTo("#s2-bg-arc-group", { y: 0 }, { y: -14, duration: 5, ease: "none" }, 0);

          tl.fromTo("#s2-eyebrow", { opacity: 0.2, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: eases.nobleReveal }, 0.05);
          tl.fromTo("#s2-title", { opacity: 0.15, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: eases.nobleReveal }, 0.12);
          tl.fromTo("#s2-divider-pill", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: eases.nobleReveal }, 0.3);

          tl.fromTo("#s2-node-1", { opacity: 0, x: -45 }, { opacity: 1, x: 0, duration: 0.45, ease: eases.structureSettle }, 0.35);
          tl.fromTo("#s2-wilma-stroke-1", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.6, ease: eases.structureSettle }, 0.4);

          tl.fromTo("#s2-conn-1", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.78);
          tl.fromTo("#s2-line-1", { strokeDashoffset: 34 }, { strokeDashoffset: 0, duration: 0.4, ease: eases.structureSettle }, 0.78);
          tl.fromTo("#s2-dot-1", { y: -14, opacity: 0 }, { y: 14, opacity: 1, duration: 0.45, ease: "none" }, 0.82);

          tl.fromTo("#s2-node-2", { opacity: 0, x: 45 }, { opacity: 1, x: 0, duration: 0.45, ease: eases.structureSettle }, 1.05);
          tl.fromTo("#s2-wilma-stroke-2", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.6, ease: eases.structureSettle }, 1.1);

          tl.fromTo("#s2-conn-2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.48);
          tl.fromTo("#s2-line-2", { strokeDashoffset: 34 }, { strokeDashoffset: 0, duration: 0.4, ease: eases.structureSettle }, 1.48);
          tl.fromTo("#s2-dot-2", { y: -14, opacity: 0 }, { y: 14, opacity: 1, duration: 0.45, ease: "none" }, 1.52);

          tl.fromTo("#s2-console", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: eases.structureSettle }, 1.78);
          tl.fromTo("#s2-code-1", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: eases.structureSettle }, 1.95);
          tl.fromTo("#s2-code-2", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: eases.structureSettle }, 2.1);
          tl.fromTo("#s2-code-3", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: eases.structureSettle }, 2.25);
          tl.fromTo("#s2-cursor", { opacity: 1 }, { opacity: 0.15, duration: 0.45, repeat: 3, yoyo: true, ease: "none" }, 2.55);

          // Transición Pager Cover hacia Escena 3 (#101A39) (4.30s -> 5.00s)
          tl.fromTo("#s2-curtain", { y: 1920 }, { y: 0, duration: 0.7, ease: eases.pagerCover }, 4.3);
          tl.fromTo("#s2-safe", { scale: 1, opacity: 1 }, { scale: 0.96, opacity: 0.2, duration: 0.7, ease: eases.pagerCover, immediateRender: false }, 4.3);
          tl.fromTo("#s2-stage", { filter: "brightness(1)" }, { filter: "brightness(0.88)", duration: 0.7, ease: eases.pagerCover }, 4.3);

          window.__timelines = window.__timelines || {};
          window.__timelines["scene-02-technical-light"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
